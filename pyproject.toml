[project]
name = "pokecal"
version = "0.1.0"
description = "Sync Play! Pokémon TCG store events to open iCalendar / Webcal feeds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.4.3",
    "icalendar>=7.3.0",
    "playwright>=1.64.1",
    "playwright-stealth>=2.0.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "pytz>=2026.6",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "timezonefinder>=9.2.0",
    "typer>=0.27.3",
]

[project.scripts]
pokecal = "pokecal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

