name: Agent task (user story)
description: A well-scoped story designed to be assigned to a coding agent
title: "[Agent] "
labels: ["user-story", "agent-ready"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it small: one story = one PR. Link files instead of pasting code.

  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who needs what, and why.
      placeholder: |
        As a [type of user], I want [goal], so that [benefit].
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / context
      description: What is happening today and why it matters. 2-5 sentences.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Relevant files and entry points
      description: Paths, modules, or functions the agent should start from.
      placeholder: |
        - pokecal/search.py (token refresh logic)
        - pokecal/tests/test_search.py (existing tests to extend)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable, ideally verifiable by running a command.
      placeholder: |
        - [ ] Given an expired token, when a request is made, then the session refreshes once
        - [ ] `uv run pytest` passes, including new tests for this case
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Implementation guidance
      description: Preferred approach, patterns to follow, constraints.
      placeholder: |
        - Follow the pattern used in pokecal/config.py
        - Do not add new dependencies
    validations:
      required: false

  - type: textarea
    id: boundaries
    attributes:
      label: Out of scope / do not touch
      description: Files, behaviors, or refactors the agent must leave alone.
      placeholder: |
        - Do not change the public API of SessionClient
        - No changes to database migrations
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: How to build, test, and verify
      description: Exact commands. Skip if already covered in AGENTS.md or copilot-instructions.md.
    validations:
      required: false

  - type: dropdown
    id: size
    attributes:
      label: Expected size
      options:
        - Small (1-3 files)
        - Medium (4-10 files)
        - Large (split this into multiple stories)
    validations:
      required: true
